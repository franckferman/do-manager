version: 2

project_name: do-manager

before:
  hooks:
    - go mod tidy

builds:
  - id: do-manager
    main: .
    binary: do-manager
    ldflags:
      - -s -w
      - -X 'github.com/franckferman/do-manager/cmd.Version={{ .Version }}'
      - -X 'github.com/franckferman/do-manager/cmd.Commit={{ .ShortCommit }}'
      - -X 'github.com/franckferman/do-manager/cmd.BuildDate={{ .Date }}'
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: franckferman
    name: do-manager
  name_template: "v{{ .Version }}"
  draft: false
  prerelease: auto
